<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>GitHub Live Search</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 40px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 10px;
    }

    h1 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      margin-bottom: 10px;
      box-sizing: border-box;
    }

    #status {
      margin-bottom: 16px;
      color: #555;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      margin-bottom: 8px;
      background: #eef2ff;
      border-radius: 6px;
    }

    img {
      border-radius: 50%;
    }

    .member-box {
      margin-bottom: 30px;
    }

    .member-inputs {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .member-inputs input {
      flex: 1;
    }

    button {
      padding: 10px 14px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background: #2563eb;
      color: white;
    }

    .delete-btn {
      margin-left: auto;
      background: crimson;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Members List</h1>

    <div class="member-box">

      <div class="member-inputs">

        <input
          type="text"
          id="memberName"
          placeholder="Enter member name"
        />

        <input
          type="text"
          id="memberRole"
          placeholder="Enter role"
        />

        <button id="addBtn">
          Add Member
        </button>

      </div>

      <ul id="members"></ul>

    </div>


    <hr />


    <h1>GitHub User Search</h1>

    <input
      id="q"
      placeholder="Search GitHub users..."
    />

    <div id="status"></div>

    <ul id="results"></ul>

  </div>

  <script type="module" src="app.js"></script>

</body>
</html>
