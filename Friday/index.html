<!DOCTYPE html>
<html>
<head>

  <title>Notes App</title>

  <link rel="stylesheet" href="style.css" />

</head>
<body>

  <div class="container">

    <h1>Notes App</h1>

    <input
      id="search"
      placeholder="Search notes..."
    />

    <form id="note-form">

      <input
        name="title"
        placeholder="Title"
        required
      />

      <textarea
        name="body"
        placeholder="Note body"
        required
      ></textarea>

      <input
        name="tags"
        placeholder="Comma separated tags"
      />

      <button type="submit">
        Add Note
      </button>

    </form>

    <div id="tag-filters"></div>

    <div id="notes"></div>

  </div>

  <script type="module" src="./src/app.js"></script>

</body>
</html>
